# Local demo infrastructure for vox-streaming.
#
# Brings up everything EXCEPT the streaming service itself:
#   - redis        session/segment registry + pub/sub for the monitor
#   - kafka         event bus (KRaft, single node)
#   - minio         S3-compatible object storage (replaces AWS for local runs)
#   - devserver     exam gRPC stub + JWT token minter (dev only)
#   - web           nginx serving the demo pages + reverse-proxying to the host
#
# The vox-streaming service runs on the HOST (go run) so WebRTC media (ephemeral
# UDP) flows directly between the browser and the server without Docker NAT.
# See README.md and run-service.ps1 / run-service.sh.
#
#   docker compose up -d --build
#   # then, in the repo root:  ./demo/run-service.ps1
#
# Open http://localhost:5173

name: vox-demo

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094" # EXTERNAL listener, reachable from the host at localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API — presigned frame/recording URLs resolve here
      - "9001:9001" # web console (login: minioadmin / minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Match the region the streaming server sends on CreateBucket (storage.DefaultConfig).
      MINIO_SITE_REGION: ap-southeast-2
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  devserver:
    build:
      context: ..                      # repo root: imports pkg/auth + pkg/pb
      dockerfile: demo/devserver/Dockerfile
    image: vox-devserver:latest
    ports:
      - "9095:9095" # gRPC exam stub (EXAM_SERVICE_GRPC_ADDR)
      - "8090:8090" # HTTP token minter
    environment:
      # MUST match the streaming server's JWT_STREAM_SECRET (see run-service scripts).
      JWT_STREAM_SECRET: "demo-super-secret-change-me-1234567890"
      GRPC_LISTEN: ":9095"
      HTTP_LISTEN: ":8090"

  web:
    image: nginx:alpine
    depends_on:
      - devserver
    ports:
      - "5173:5173"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host-run streaming server (Linux)

volumes:
  minio-data:
