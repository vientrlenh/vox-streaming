# Reverse proxy so the browser only ever talks to one origin (http://localhost:5173).
# This keeps every request same-origin: no CORS, and the streaming server's
# WebSocket Origin check (ALLOWED_ORIGIN=http://localhost:5173) always passes.
#
#   /                  -> static demo pages (this container)
#   /token             -> devserver (exam stub + token minter, in this compose)
#   /ws/*, /schedules/, /live/ -> vox-streaming server running on the HOST (via go run)
#
# NOTE: /live/ covers both the playlist and the init/fragment URIs it points at,
# all proxied here. The fragment requests answer with a 302 to a presigned
# STORAGE_ENDPOINT URL (localhost:9000 in the demo), which the browser then
# follows directly — so the media bytes themselves never pass through nginx.

server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Dev token minter (compose service, reachable by name).
    location /token {
        proxy_pass http://devserver:8090;
    }

    # WebSocket signaling to the host-run streaming server.
    location /ws/ {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Plain HTTP endpoints on the host-run streaming server.
    location /schedules/ {
        proxy_pass http://host.docker.internal:8082;
    }

    location /live/ {
        proxy_pass http://host.docker.internal:8082;
    }
}
