<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student · vox-streaming demo</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <h1>👤 Student — đẩy stream</h1>
    <div class="spacer"></div>
    <nav><a href="index.html">Home</a><a href="monitor.html">Monitor</a></nav>
  </header>
  <main>
    <div class="card">
      <h2>Cấu hình</h2>
      <div class="row">
        <div class="field">
          <label>Schedule ID</label>
          <input id="scheduleId" value="00000000-0000-0000-0000-000000000001" />
        </div>
        <div class="field">
          <label>User ID (thí sinh)</label>
          <input id="userId" value="student-1" />
        </div>
        <div class="field">
          <label>Session ID (tuỳ chọn)</label>
          <input id="sessionId" placeholder="để trống = scheduleId:userId" />
        </div>
        <div class="field">
          <label>Nguồn</label>
          <select id="streamType">
            <option value="camera">camera (webcam + mic)</option>
            <option value="screen">screen (chia sẻ màn hình)</option>
          </select>
        </div>
        <button id="startBtn">Start streaming</button>
        <button id="stopBtn" class="danger" disabled>Stop</button>
        <span class="pill"><span id="dot" class="dot"></span><span id="stateText">idle</span></span>
      </div>
      <p class="hint">
        Trình duyệt sẽ mã hoá <b>H.264</b> (server chỉ nhận H.264/Opus). Nếu bấm Start mà bị chặn:
        kiểm tra đã mở trang qua <code>http://localhost:5173</code> và cho phép quyền camera/màn hình.
      </p>
    </div>

    <div class="row" style="align-items: stretch;">
      <div class="card" style="flex:1; min-width:320px;">
        <h2>Preview (local)</h2>
        <video id="preview" autoplay muted playsinline></video>
      </div>
      <div class="card" style="flex:1; min-width:320px;">
        <h2>Log</h2>
        <div id="log" class="log"></div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="student.js"></script>
</body>
</html>
