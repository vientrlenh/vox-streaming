name: CD

# Chạy sau khi CI (ci.yml) hoàn thành thành công cho 1 lần push lên `main` --
# không tự chạy khi có push, tránh deploy 1 commit chưa build/test qua.
#
# LƯU Ý: workflow_run chỉ fire nếu chính file workflow này (cd.yml) đã tồn tại
# trên nhánh mặc định (`main`) của repo -- nếu vẫn còn đang test trên nhánh
# testDeploy (như ci.yml hiện tại), gate này sẽ KHÔNG chạy cho tới khi cd.yml
# (và ci.yml) được merge vào main thật.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  docker-build-push:
    name: Build Docker image and push to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      ecr_image: ${{ steps.build_outputs.outputs.ecr_image }}
      image_tag: ${{ steps.build_outputs.outputs.image_tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # workflow_run chạy trong context nhánh mặc định lúc workflow file
          # này được đọc, KHÔNG phải commit đã build CI -- phải ghim rõ
          # head_sha của run CI vừa hoàn thành, nếu không sẽ build nhầm commit.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: echo "tag=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # Layer cache keyed per-repo in GitHub Actions' own cache backend --
          # unchanged layers (e.g. `go mod download`) get reused between runs
          # instead of a full rebuild every time. `mode=max` also caches
          # intermediate build-stage layers, not just the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set job outputs
        id: build_outputs
        run: |
          echo "ecr_image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

  update-helm:
    name: Update vox-helm image tag
    runs-on: ubuntu-latest
    needs: docker-build-push
    env:
      HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
      HELM_REPO_OWNER: ${{ vars.HELM_REPO_OWNER || secrets.HELM_REPO_USER }}
      ECR_IMAGE: ${{ needs.docker-build-push.outputs.ecr_image }}
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
    steps:
      - name: Install yq
        run: |
          sudo curl -L https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Clone Helm repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${HELM_REPO_OWNER}/${HELM_REPO_NAME}.git" helm-repo

      - name: Update values.yaml
        run: |
          cd helm-repo
          yq eval '.image.repository = env(ECR_IMAGE) | .image.tag = strenv(IMAGE_TAG)' -i charts/vox-streaming/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if ! git diff --quiet; then
            git add charts/vox-streaming/values.yaml
            git commit -m "Update vox-streaming image tag to ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
