# docker-compose cho RIÊNG service vox-streaming.
# Phụ thuộc ngoài (Redis, Kafka, MinIO/S3, coturn, exam gRPC service) chạy ở nơi khác và
# được với tới qua địa chỉ trong .env.
#
#   docker compose up -d --build      # build image + chạy
#   docker compose logs -f            # xem log
#   docker compose down               # dừng
#
# ---------------------------------------------------------------------------
# MẠNG -- đọc kỹ, đây là chỗ đã từng làm service chạy mà không ai gọi được
#
# Dùng BRIDGE + publish cổng, KHÔNG dùng network_mode: host.
#
# `network_mode: host` chỉ thật sự là mạng của máy chủ trên Linux. Trên Docker Desktop
# (Windows/macOS) container nằm trong máy ảo Linux của Docker, nên "host" là host của MÁY ẢO
# đó chứ không phải máy bạn. Đo ngày 2026-08-06: container nhận IP 192.168.65.3, và
#   host -> :8082/:9090/:9096   FAIL cả ba (không publish cổng nào)
#   container -> redis/kafka/agents trên máy   FAIL cả ba
# Service vẫn báo "healthy" vì HEALTHCHECK tự gọi chính nó BÊN TRONG container -- hỏng mạng
# không làm healthcheck đỏ, nên lỗi này im lặng.
#
# Service là một điểm cuối WebRTC: đặt WEBRTC_UDP_PORT trong .env để Pion dồn media của MỌI
# peer vào ĐÚNG MỘT cổng UDP, nhờ đó chỉ cần publish một cổng thay vì cả dải ephemeral.
# Và đặt WEBRTC_NAT_1TO1_IP thành IP mà trình duyệt với tới được, nếu không host candidate
# quảng bá IP nội bộ của container và client không kết nối được.
# ---------------------------------------------------------------------------

services:
  vox-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    image: vox-streaming:latest
    container_name: vox-streaming

    # Cổng phải khớp .env (WEBRTC_ADDR / GRPC_ADDR / METRIC_ADDR / WEBRTC_UDP_PORT) và khớp
    # Dockerfile EXPOSE. Bốn cổng này đã kiểm là còn trống trên máy: 8080 là vox-app,
    # 8081 kafka-ui, 8000 agents, 9092/9094 kafka, 5432/5433 postgres, 6379 redis.
    ports:
      - '8082:8082'          # HTTP / WebSocket signaling   (WEBRTC_ADDR)
      - '9096:9096'          # gRPC AlertService            (GRPC_ADDR) -- vox gọi vào đây
      - '9098:9098'          # metrics + /healthz           (METRIC_ADDR)
      - '50000:50000/udp'    # WebRTC media mux             (WEBRTC_UDP_PORT)

    # CHUNG MẠNG với vox: Redis/Kafka gọi thẳng bằng TÊN SERVICE (redis:6379, kafka:9092),
    # không qua host.docker.internal nữa. Đổi lại được ba thứ:
    #   - hết bẫy advertised-listener: listener INTERNAL của Kafka quảng bá "kafka:9092",
    #     địa chỉ đó đúng từ trong mạng nên EnsureTopics tìm được controller
    #   - vox-app gọi ngược lại bằng "vox-streaming:9096", không cần host-gateway
    #   - traffic không phải vòng ra ngoài host rồi quay lại
    #
    # extra_hosts VẪN GIỮ: agents chạy thẳng trên máy (không trong docker) nên
    # AI_WEBRTC_URL vẫn phải đi qua host.docker.internal.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - vox-network

    # godotenv.Load() trong cmd/server/main.go đọc ./.env từ thư mục làm việc và FATAL nếu
    # thiếu file. Bind-mount chỉ-đọc để container dùng chung cấu hình mà không nướng bí mật
    # vào image.
    volumes:
      - ./.env:/app/.env:ro
      # Tách phần ghi tạm của segment/recording khỏi lớp container (SEGMENT_TEMP_DIR=/app/tmp).
      - vox-tmp:/app/tmp

    # Dọn tiến trình ffmpeg zombie (do recorder/assembler sinh ra).
    init: true

    restart: unless-stopped

    # Chặn trần tài nguyên để một job assembly/ffmpeg chạy loạn không ăn hết máy.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    # Healthcheck liveness khai trong Dockerfile (gọi /healthz trên METRIC_ADDR).

volumes:
  vox-tmp:

# Mạng do vox/docker-compose.yml tạo (nó khai `name: vox-network` tường minh nên tên không bị
# thêm tiền tố project). `external: true` nghĩa là compose này KHÔNG tạo mạng, chỉ tham gia --
# nên phải `docker compose up` bên vox TRƯỚC, nếu không lệnh ở đây báo network not found.
networks:
  vox-network:
    external: true
    name: vox-network

# ===========================================================================
# CHỈ TRÊN LINUX: nếu chạy Docker Engine thật (không phải Docker Desktop) thì có thể đổi
# khối ports/extra_hosts ở trên thành:
#
#     network_mode: host
#
# và trong .env đổi các địa chỉ host.docker.internal:* về localhost:*. Lúc đó không cần
# publish cổng nữa vì container dùng chung stack mạng với máy. Với UDP mux thì host mode
# KHÔNG còn bắt buộc -- bridge ở trên chạy được ở mọi nền, nên chỉ đổi khi có lý do rõ ràng.
# ===========================================================================
